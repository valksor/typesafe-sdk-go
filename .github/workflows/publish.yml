name: Publish Go module

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without creating a GitHub Release
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish-go
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'valksor/typesafe-sdk-go'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: go
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Validate release tag and extract changelog notes
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          VERSION="$(python3 .github/scripts/version.py)"
          if [ "$DRY_RUN" = true ]; then
            TAG="v$VERSION"
          else
            test "$REPOSITORY_PRIVATE" = false || { echo 'Repository must be public before publishing the Go module'; exit 1; }
            test "$GITHUB_REF_TYPE" = tag || { echo 'Select a public version tag for publication'; exit 1; }
            TAG="$GITHUB_REF_NAME"
            git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH" || { echo 'Release tag must be on the public default branch'; exit 1; }
          fi
          python3 .github/scripts/release_notes.py "$TAG" "$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test public source
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -shuffle=on -race -cover ./...
          go vet ./...
      - name: Build source archives
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir release
          git archive --format=tar.gz --prefix="typesafe-sdk-go-$VERSION/" --output="release/typesafe-sdk-go-$VERSION.tar.gz" HEAD
          git archive --format=zip --prefix="typesafe-sdk-go-$VERSION/" --output="release/typesafe-sdk-go-$VERSION.zip" HEAD
          mv release-notes.md release/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-release
          path: release/
          if-no-files-found: error
      - name: Create or update GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release/release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TITLE" --notes-file release/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/*.tar.gz release/*.zip --clobber
      - name: Summarize release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            echo 'Dry run passed. Review the go-release artifact; no GitHub Release was created.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published $RELEASE_TAG. The Git tag is the Go module version; the GitHub Release contains tested source archives." >> "$GITHUB_STEP_SUMMARY"
          fi

